name: Päivitä tiedot ja julkaise

on:
  push:
    branches: [main]
    # Vain talojen sivuun vaikuttavat muutokset käynnistävät ajon (metsätilojen laskenta, selvitykset ja dokumentit eivät).
    # web/metsa.js on mukana, koska Talokartta tarjoilee sen. Metsätilojen tiedot päivittää Metsakartan oma ajo.
    paths:
      - "pipeline/config.py"
      - "pipeline/talot/**"
      - "pipeline/yhteiset/**"
      - "pipeline/requirements.txt"
      - "pipeline/requirements-shore.txt"
      - "web/**"
      - "check/sivutarkistus.mjs"
      - "check/paikallinen.mjs"
      - "check/package.json"
      - ".github/workflows/build-deploy.yml"
      - ".github/workflows/check-site.yml"
      - ".github/actions/julkaise-pages/**"
  schedule:
    - cron: "17 2 * * *"   # joka yö noin klo 4–5 Suomen aikaa
  workflow_dispatch:        # käsin: Actions → "Päivitä tiedot ja julkaise" → Run workflow
    inputs:
      koe_virhe:
        description: "Koe: anna ajon epäonnistua heti (ilmoituksen testaus)"
        type: boolean
        default: false
      ohita_tarkistukset:
        description: "Julkaise, vaikka turvatarkistus huomauttaisi (vain kun pudotus on todellinen, esim. kunta poistettu)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # ensimmäinen palstojen haku kestää pisimpään
    outputs:               # sivun tarkistus vertaa julkaistua sivua näihin
      updated: ${{ steps.meta.outputs.updated }}
      count: ${{ steps.meta.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Asenna työkalut
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tippecanoe
          pip install -r pipeline/requirements.txt -r pipeline/requirements-shore.txt   # jälkimmäinen: rantatieto (irrotettava)

      - name: Pikatestit
        run: python -m pipeline.selftest

      - name: Koe-epäonnistuminen
        if: inputs.koe_virhe
        run: |
          echo "::error title=Koe::Ajo pysäytettiin tarkoituksella ilmoituksen testaamiseksi (käsiajon valinta koe_virhe)."
          exit 1

      # Kiinteistöpalstat säilytetään ajojen välillä (ladataan uudelleen viikon välein), jotta MML:n palvelua ei kuormiteta turhaan.
      - name: Palauta palstojen välimuisti
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: parcels-none
          restore-keys: parcels-

      - name: Hae rekisteritiedot ja tee karttatiilet
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}   # MML:n tiedostopalvelu (palstat); ilman avainta käytetään WFS:ää
          SKIP_CHECKS: ${{ inputs.ohita_tarkistukset }}
        timeout-minutes: 210    # ohjelma lopettaa palstahaun itse jo 150 min kohdalla (config.PARCEL_TIME_BUDGET_MIN)
        run: python -m pipeline.talot --out dist --work work --cache cache

      # Välimuisti tallennetaan myös epäonnistuneen ajon jälkeen, jotta jo haetut palstat eivät katoa.
      - name: Välimuistin tunniste
        id: stamp
        if: always()
        run: echo "v=$(cat cache/parcels.stamp 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Tallenna palstojen välimuisti
        if: always() && steps.stamp.outputs.v != 'none'
        uses: actions/cache/save@v5
        continue-on-error: true   # sama versio on jo tallessa
        with:
          path: cache
          key: parcels-${{ steps.stamp.outputs.v }}

      - name: Koko
        run: ls -la dist dist/data

      - name: Vertailuluvut sivun tarkistukselle
        id: meta
        run: |
          echo "updated=$(jq -r .updated dist/data/meta.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .count dist/data/meta.json)" >> "$GITHUB_OUTPUT"

      # Tarkistus ennen julkaisua: valmis sivu (dist/) tarjoillaan paikallisesti ja avataan oikeassa selaimessa.
      # Jos sivu ei toimi, julkaisua ei tehdä (sivulle jää edellinen versio) ja omistaja saa ilmoituksen.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tarkista sivu ennen julkaisua
        working-directory: check
        env:
          SITE_URL: http://localhost:8080/
          EXPECT_UPDATED: ${{ steps.meta.outputs.updated }}
          EXPECT_COUNT: ${{ steps.meta.outputs.count }}
          OUT_DIR: ${{ github.workspace }}/esitarkistus
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          nohup node paikallinen.mjs ../dist 8080 > ../palvelin.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          node sivutarkistus.mjs

      - name: Tallenna esitarkistuksen kuvakaappaukset
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: esitarkistus
          path: esitarkistus
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read      # julkaisutiedoston tunnus tämän ajon artefakteista
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Oma julkaisuvaihe (9.11.2026) actions/deploy-pagesin tilalle: ei 10 min rajaa eikä perumista, oma versiotunnus
      # jokaiselle yritykselle ja automaattinen uusi yritys. Sama vaihe Metsakartassa. Syy: HISTORIA.md, julkaisun jumit.
      # Lukittu tagiin julkaisu-v1 (uusi versio käyttöön tagia siirtämällä, ks. CLAUDE.md).
      - id: deployment
        uses: vv-tec/Talokartta/.github/actions/julkaise-pages@julkaisu-v1

  # Sivun tarkistus julkaisun jälkeen: avaa sivun selaimessa ja varmistaa, että se toimii (check-site.yml).
  # Ei voi perua jo tehtyä julkaisua, mutta hälyttää notify-jobin kautta.
  check:
    needs: [build, deploy]
    uses: ./.github/workflows/check-site.yml
    with:
      expected_updated: ${{ needs.build.outputs.updated }}
      expected_count: ${{ needs.build.outputs.count }}

  # Ilmoitus omistajalle: epäonnistunut ajo avaa GitHub-ilmoituksen (issue), josta tulee sähköposti.
  # Seuraava onnistunut ajo sulkee sen. Jos build tai deploy epäonnistuu, sivulla näkyy edellinen onnistunut versio;
  # jos vain tarkistus epäonnistuu, uusi versio on julkaistu mutta jokin sivulla ei toimi.
  notify:
    needs: [build, deploy, check]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.check.result == 'failure' }}
      PUBLISHED: ${{ needs.deploy.result == 'success' }}
    steps:
      - name: Avaa tai sulje ilmoitus
        run: |
          LABEL="ajo-epäonnistui"
          gh label create "$LABEL" --color d73a4a --description "Talokartan päivitysajo epäonnistui" 2>/dev/null || true
          OPEN=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          WHEN=$(TZ=Europe/Helsinki date '+%-d.%-m.%Y klo %H.%M')
          if [ "$FAILED" = "true" ]; then
            JOBS=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs")
            WHERE=$(echo "$JOBS" | jq -r '[.jobs[] | select(.conclusion=="failure") | .name + ": " + ([.steps[] | select(.conclusion=="failure") | .name] | join(", "))] | join("; ")')
            # ohjelman oma selitys (::error-rivit), ei GitHubin yleistä "exit code 1" -viestiä
            WHY=""
            for J in $(echo "$JOBS" | jq -r '.jobs[] | select(.conclusion=="failure") | .id'); do
              WHY="$WHY$(gh api "repos/$GH_REPO/check-runs/$J/annotations" --jq '.[] | select(.annotation_level=="failure") | select(.message | test("exit code") | not) | .message' 2>/dev/null)"
            done
            if [ "$PUBLISHED" = "true" ]; then
              TITLE="Talokartan sivun tarkistus löysi ongelman"
              STATE="Tiedot päivittyivät ja sivu julkaistiin, mutta automaattinen tarkistus huomasi, ettei kaikki sivulla toimi.
          Kuvakaappaukset: ajon sivun alareunassa liitteenä **sivutarkistus**. Pyydä Claudea selvittämään, jos ongelma toistuu."
            else
              TITLE="Talokartan päivitys epäonnistui"
              STATE="Sivulla näkyy edellinen onnistunut versio, joten mikään ei ole rikki – tiedot vain eivät päivittyneet."
            fi
            BODY="$TITLE: $WHEN (${{ github.event_name }}).

          Kohta: ${WHERE:-ei tiedossa}
          ${WHY:+Syy: }$WHY
          Ajon loki: $RUN_URL

          $STATE
          Tämä ilmoitus sulkeutuu itsestään, kun seuraava ajo onnistuu. @vv-tec"
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Päivitys onnistui taas $WHEN ($RUN_URL). Sivu on ajan tasalla."
          else
            echo "Ajo onnistui, ei avoimia ilmoituksia."
          fi
