name: Selvitys – Ryhti-kentät

# Käsin käynnistettävä: listaa Ryhtin avointen aineistojen kentät ja täyttöasteet yhdestä kunnasta.
on:
  workflow_dispatch:
    inputs:
      kunta:
        description: "Kuntanumero (esim. 834 = Tammela), delta = muutoshaun testi, puuttuu:NNN = miksi kunnalta ei löydy rakennuksia tai maakunnat = kuntalistojen tarkistus"
        default: "834"

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: |
          case "${{ inputs.kunta }}" in delta|maakunnat|puuttuu:*) ;; *) python -m pipeline.selvitykset.codes_explore ;; esac
          python -m pipeline.selvitykset.ryhti_explore "${{ inputs.kunta }}"
